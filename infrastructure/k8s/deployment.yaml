apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultmesh-backend
  labels:
    app: vaultmesh-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vaultmesh-backend
  template:
    metadata:
      labels:
        app: vaultmesh-backend
    spec:
      containers:
        - name: fastapi-api
          image: vaultmesh_backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultmesh-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://vaultmesh-redis-svc:6379/0"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultmesh-celery-worker
  labels:
    app: vaultmesh-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vaultmesh-celery-worker
  template:
    metadata:
      labels:
        app: vaultmesh-celery-worker
    spec:
      containers:
        - name: celery-worker
          image: vaultmesh_backend:latest
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultmesh-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://vaultmesh-redis-svc:6379/0"
---
apiVersion: v1
kind: Service
metadata:
  name: vaultmesh-backend-svc
spec:
  type: LoadBalancer
  selector:
    app: vaultmesh-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vaultmesh-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vaultmesh-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75