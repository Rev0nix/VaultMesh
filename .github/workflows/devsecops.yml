name: VaultMesh DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test-and-sast:
    name: Backend Tests & Bandit SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & Bandit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit==1.8.0

      - name: Run Bandit SAST Security Scan
        run: bandit -r app -x app/tests -ll

      - name: Run Pytest Suite
        run: pytest -v

  frontend-build-check:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build
        run: |
          npm ci
          npm run build

  iac-and-secrets-scan:
    name: Checkov IaC & Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/terraform
          framework: terraform
          skip_check: CKV_AWS_355
          soft_fail: false
